name: CI
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The cache holds the browser only; its system libraries still come from apt.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: docker compose up -d --wait
      - run: pnpm check

  terraform:
    runs-on: ubuntu-latest
    env:
      TF: docker run --rm -v ${{ github.workspace }}:/repo -w /repo/infra hashicorp/terraform:1.17.1
      TFLINT: docker run --rm -e GITHUB_TOKEN -e TFLINT_PLUGIN_DIR=/repo/.tflint.d -v ${{ github.workspace }}:/repo -w /repo/infra ghcr.io/terraform-linters/tflint:v0.65.0
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'lambdas/**'
              - '.github/workflows/ci.yml'
      - if: steps.changes.outputs.infra == 'true'
        run: $TF fmt -check -recursive
      - if: steps.changes.outputs.infra == 'true'
        run: $TF init -backend=false -input=false
      - if: steps.changes.outputs.infra == 'true'
        run: $TF validate
      - if: steps.changes.outputs.infra == 'true'
        run: $TF test
      - if: steps.changes.outputs.infra == 'true'
        run: $TFLINT --init && $TFLINT --recursive --config /repo/infra/.tflint.hcl
