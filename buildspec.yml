# Release build, run by CodeBuild (arm64, privileged) for a pushed v* tag. All commands of a build share one shell.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g corepack
      - corepack enable
      - docker compose version

  pre_build:
    commands:
      # Prints the one v* tag on HEAD, or fails the build.
      - RELEASE_TAG=$(scripts/release-check.sh)
      - echo "releasing $RELEASE_TAG"
      - pnpm install --frozen-lockfile
      - pnpm check

  build:
    commands:
      - VERSION=${RELEASE_TAG#v}
      - COMMIT=$(git rev-parse --short=7 HEAD)
      - REGISTRY=${ECR_REPOSITORY_URL%%/*}
      - aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - >-
        docker buildx build --platform linux/arm64
        --build-arg PUBLIC_VERSION="$VERSION" --build-arg PUBLIC_COMMIT="$COMMIT" --build-arg PUBLIC_BRANCH=main
        --build-arg PUBLIC_CF_BEACON="$PUBLIC_CF_BEACON"
        -t "$ECR_REPOSITORY_URL:$RELEASE_TAG" -t "$ECR_REPOSITORY_URL:$COMMIT" --push .
      - >-
        aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" --image-ids imageTag="$RELEASE_TAG"
        --query 'imageDetails[0].imageSizeInBytes' --output text | awk '{printf "compressed image size: %.1f MB\n", $1/1048576}'

  post_build:
    commands:
      # post_build also runs after a failed build; never deploy then.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      # "none" is the pipeline's stand-in for "no override".
      - EXPECTED_VERSION=$VERSION
      - if [ -n "${EXPECTED_VERSION_OVERRIDE:-}" ] && [ "$EXPECTED_VERSION_OVERRIDE" != none ]; then EXPECTED_VERSION=$EXPECTED_VERSION_OVERRIDE; fi
      - PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
      # Playwright's browsers need a supported Linux, so the deployed checks run in its official image.
      - >-
        scripts/deploy.sh "$ECR_REPOSITORY_URL:$RELEASE_TAG"
        docker run --rm --ipc=host -v "$PWD:/work" -w /work
        -e BASE_URL=https://juanalmaraz.dev -e FUNCTION_URL -e EXPECTED_VERSION="$EXPECTED_VERSION"
        "mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble" npm run e2e:deployed
